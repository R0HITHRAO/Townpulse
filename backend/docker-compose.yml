version: '3.8'

services:
  # ─── PostgreSQL with PostGIS Extension ───────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: townpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-townpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-townpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-townpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-townpulse} -d ${POSTGRES_DB:-townpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Rate Limiting ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: townpulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: townpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-townpulse}:${POSTGRES_PASSWORD:-townpulse_dev_password}@postgres:5432/${POSTGRES_DB:-townpulse}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-townpulse-super-secret-key-32-chars-min!}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
