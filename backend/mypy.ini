[mypy]
python_version = 3.11
plugins = pydantic.mypy
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# These ship no type information. They are optional integrations that are
# imported lazily inside try/except ImportError blocks, so mypy cannot see the
# guard and reports "module is installed, but missing library stubs".
[mypy-jose.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-kombu.*]
ignore_missing_imports = True

[mypy-sendgrid.*]
ignore_missing_imports = True

[mypy-twilio.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-pywebpush.*]
ignore_missing_imports = True

[mypy-py_vapid.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True

[mypy-prometheus_fastapi_instrumentator.*]
ignore_missing_imports = True

[mypy-app.tasks.*]
# Celery task objects are typed as Any by the untyped celery stubs.
disallow_untyped_calls = False