version: '3.8'

services:
  # ─── PostgreSQL with PostGIS ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: townpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-townpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-townpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-townpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-townpulse} -d ${POSTGRES_DB:-townpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Rate Limiting ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: townpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: townpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-townpulse}:${POSTGRES_PASSWORD:-townpulse_dev_password}@postgres:5432/${POSTGRES_DB:-townpulse}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-townpulse-secret-key-for-local-dev-32-chars!}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # ── OTP / SMS provider (set these in .env to receive real SMS) ──
      - OTP_PROVIDER=${OTP_PROVIDER:-mock}
      - OTP_EXPIRE_MINUTES=${OTP_EXPIRE_MINUTES:-10}
      - OTP_MAX_REQUESTS_PER_HOUR=${OTP_MAX_REQUESTS_PER_HOUR:-5}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:-}
      - MSG91_SENDER_ID=${MSG91_SENDER_ID:-TWNPUL}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID:-}
      # ── Email provider (optional) ──
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@townpulse.dev}
      # ── Photo uploads ──
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-./uploads}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
      # ── Web Push (VAPID) — leave empty to disable ──
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:ops@townpulse.example}
      # ── Locality timezone for "open now" ──
      - TZ_OFFSET_MINUTES=${TZ_OFFSET_MINUTES:-330}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: townpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  uploads:
