name: TownPulse CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend Lint & Test ───────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: townpulse
          POSTGRES_PASSWORD: townpulse_dev_password
          POSTGRES_DB: townpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for GeoAlchemy / PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libgeos-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff, Black, isort)
        run: |
          cd backend
          ruff check app tests || true
          black --check app tests || true
          isort --check-only app tests || true

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://townpulse:townpulse_dev_password@localhost:5432/townpulse_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-min-32-characters-length!
          APP_ENV: development
        run: |
          cd backend
          pytest -v --tb=short

  # ─── Frontend Lint & Test ──────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint || true

      - name: Validate Design System Contrast (WCAG 2.2 AA)
        run: |
          cd frontend
          npm run validate:contrast

      # Guards the silent defect described in AUDIT.md: base.css once shipped
      # with unclosed braces, and CSS nesting silently re-parented every rule
      # after them. The build and all unit tests passed regardless.
      - name: Check Stylesheet Structure
        run: |
          cd frontend
          npm run check:css

      # Guards another silent class of defect: a key used in code but missing
      # from en.json renders its raw path ("listing.open") to the user, and the
      # Hindi catalogue falling behind English was invisible until printed.
      - name: Check i18n key coverage
        run: |
          cd frontend
          npm run check:i18n

      # Catches a pre-vercel.json-schema mistake in the build rather than in
      # production. `vercel.json` is schema-validated with additionalProperties:
      # false and Vercel reports only the first violation, so a single "//"
      # comment key there would otherwise fail each deploy one error at a time.
      - name: Validate vercel.json against Vercel's schema
        run: |
          cd frontend
          npm run check:vercel

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test

      # `npm run build` also generates the OG images, sitemap/robots.txt and the
      # pre-rendered pages, so a failure in any of those scripts fails here
      # rather than in production.
      - name: Build Frontend Bundle (incl. OG images, sitemap, prerender)
        run: |
          cd frontend
          npm run build

      # `dist/og/home.png` is asserted, not just counted, because it is the
      # fallback og:image for every route and the only OG asset committed to the
      # repo. generate:og skips rendering entirely when the native `sharp`
      # module is unavailable, so this file must survive even a degraded run.
      - name: Verify SEO artefacts landed in dist/
        run: |
          cd frontend
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/index.html
          test -f dist/og/home.png
          test -f dist/emergency/index.html
          echo "OG images in dist: $(ls dist/og/*.png 2>/dev/null | wc -l)"
          echo "Pre-rendered pages: $(find dist -name index.html | wc -l)"

      # Guards the defect that kept a fixed build invisible in production for
      # two days: the generated worker precached index.html and registered a
      # NavigationRoute ahead of every runtime route, so each reload replayed the
      # previous deployment's shell and the deployed fix never reached anyone.
      # This reads the EMITTED dist/sw.js — the config alone cannot show it.
      - name: Assert the service worker cannot pin a stale build
        run: |
          cd frontend
          npm run check:sw

      # Catches a pre-rendered page pointing og:image at a PNG that was never
      # written. This happened when generate-og skipped rendering but left the
      # previous manifest in place: 178 of 181 pages advertised a dead card.
      - name: Assert no page references a missing og:image
        run: |
          cd frontend
          node scripts/verify-og-images.mjs

      # Proves the build survives a host where the native `sharp` module cannot
      # load, which is what broke the Vercel deployment.
      #
      # Notes on the ordering, each of which fixes a real defect:
      #  - `generate:og` rewrites public/og/manifest.json, and that file IS
      #    committed (it is the committed fallback list). A degraded run reduces
      #    it to one entry, so `git checkout` restores it afterwards. Without
      #    this the job finishes with a dirty tree and a stale manifest.
      #  - The exit status of `npm run build` is captured and re-raised, because
      #    the cleanup commands in between would otherwise mask a failed build.
      #  - The degraded build runs in a step of its own, so a failure surfaces as
      #    its own check rather than being hidden inside a combined step.
      - name: Build with `sharp` unavailable
        run: |
          cd frontend
          mv node_modules/sharp node_modules/.sharp-hidden
          npm run build
          status=$?
          mv node_modules/.sharp-hidden node_modules/sharp
          git checkout -- public/og/manifest.json
          exit $status

      - name: Assert the fallback og:image survives a degraded build
        run: |
          cd frontend
          mv node_modules/sharp node_modules/.sharp-hidden
          npm run build
          degraded=$?
          mv node_modules/.sharp-hidden node_modules/sharp
          node scripts/verify-og-images.mjs
          verify=$?
          git checkout -- public/og/manifest.json
          # Rebuild so dist/ reflects a normal build for anything downstream.
          npm run build
          if [ $degraded -ne 0 ] || [ $verify -ne 0 ]; then exit 1; fi

  # ─── Docker Container Build Verification ───────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t townpulse-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t townpulse-frontend:ci ./frontend
