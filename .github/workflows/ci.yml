name: TownPulse CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend Lint & Test ───────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: townpulse
          POSTGRES_PASSWORD: townpulse_dev_password
          POSTGRES_DB: townpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for GeoAlchemy / PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libgeos-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff, Black, isort)
        run: |
          cd backend
          ruff check app tests || true
          black --check app tests || true
          isort --check-only app tests || true

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://townpulse:townpulse_dev_password@localhost:5432/townpulse_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-min-32-characters-length!
          APP_ENV: development
        run: |
          cd backend
          pytest -v --tb=short

  # ─── Frontend Lint & Test ──────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint || true

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  # ─── Docker Container Build Verification ───────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t townpulse-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t townpulse-frontend:ci ./frontend
